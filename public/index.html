<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF Tech - Spesialis Servis HP & Elektronik</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif;}
        body {background:#f8fafc; color:#1e293b;}
        header {background:#0f172a; color:white; padding:1.2rem 5%; display:flex; justify-content:space-between; align-items:center;}
        .container {max-width:800px; margin:3rem auto; padding:2rem; background:white; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.05);}
        input, select, textarea {width:100%; padding:0.8rem; margin:0.5rem 0 1rem; border:1px solid #cbd5e1; border-radius:6px;}
        .btn {background:#0ea5e9; color:white; padding:0.8rem 1.5rem; border:none; border-radius:6px; cursor:pointer; font-weight:bold; width:100%;}
        .btn-lacak {background:#f59e0b; margin-top:10px;}
        
        #panelPelacakan {display:none; background:#eff6ff; padding:2rem; border-radius:12px; margin-top:2rem; border:1px solid #bfdbfe;}
        .status-badge {padding:0.5rem 1rem; border-radius:30px; font-weight:bold; font-size:0.9rem;}
        .bg-baru {background:#e0f2fe; color:#0369a1;} .bg-proses {background:#fef3c7; color:#d97706;} .bg-selesai {background:#dcfce7; color:#15803d;}
    </style>
</head>
<body>

<header>
    <h2><i class="bi bi-tools"></i> SF Tech - Pelanggan</h2>
</header>

<div class="container" id="panelPemesanan">
    <h2 style="margin-bottom:1rem; color:#0ea5e9;">Buat Pesanan Baru</h2>
    <input type="text" id="nama" placeholder="Nama Lengkap">
    <input type="text" id="wa" placeholder="Nomor WhatsApp">
    <select id="layanan"><option value="Servis HP">Servis HP</option><option value="Servis Elektronik">Servis Elektronik</option></select>
    <input type="text" id="merek" placeholder="Merek & Tipe (Cth: Samsung A51)">
    <textarea id="kerusakan" placeholder="Keluhan / Kerusakan"></textarea>
    <button class="btn" onclick="kirimPesanan()">Kirim Pesanan Sekarang</button>
    <button class="btn btn-lacak" onclick="tanyaLacak()">Saya Sudah Punya Kode Pesanan</button>
</div>

<div class="container" id="panelPelacakan">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h3 style="color:#1e40af;">Status Pesanan Anda</h3>
        <button onclick="keluarLacak()" style="background:none; border:none; color:red; cursor:pointer;"><b>X Keluar</b></button>
    </div>
    <p>Kode Pesanan: <strong id="lblKode" style="font-size:1.2rem;">-</strong></p>
    <p style="margin:1rem 0;">Status Kerja: <span id="lblStatus" class="status-badge bg-baru">Menunggu</span></p>
    
    <div style="background:white; padding:1.5rem; border-radius:8px; border:1px dashed #cbd5e1; margin-top:1rem;">
        <h4 style="margin-bottom:10px;"><i class="bi bi-receipt"></i> Ringkasan Biaya (Sementara/Final)</h4>
        <p>Jasa Servis: Rp <span id="lblJasa">0</span></p>
        <p>Suku Cadang (Part): Rp <span id="lblSuku">0</span></p>
        <p style="color:#ef4444;">Kerusakan Tambahan: Rp <span id="lblTambahan">0</span></p>
        <hr style="margin:10px 0;">
        <p style="font-size:1.2rem; font-weight:bold; color:#1e40af;">Total Tagihan: Rp <span id="lblTotal">0</span></p>
    </div>
    
    <div style="margin-top:2rem; border-top:2px solid #e2e8f0; padding-top:1rem;">
        <h4><i class="bi bi-chat-dots"></i> Chat dengan Admin</h4>
        <div id="chatBox" style="height:150px; overflow-y:auto; background:#f1f5f9; padding:1rem; margin-top:10px; border-radius:6px; font-size:0.85rem;"></div>
        <div style="display:flex; margin-top:10px;">
            <input type="text" id="inputChat" placeholder="Ketik pesan ke admin..." style="margin:0; border-radius:6px 0 0 6px;">
            <button class="btn" style="width:auto; border-radius:0 6px 6px 0;" onclick="kirimChat()">Kirim</button>
        </div>
    </div>
</div>

<script>
    const API_URL = window.location.origin + "/api";
    let kodeSaya = localStorage.getItem("kodePelanggan") || "";
    const socket = io(window.location.origin);

    socket.on("updateDataPelanggan", (kode) => { if(kode === kodeSaya) muatPelacakan(); });
    socket.on("chatBaruDiterima", (kode) => { if(kode === kodeSaya) muatChat(); });

    if(kodeSaya) { document.getElementById("panelPemesanan").style.display = "none"; document.getElementById("panelPelacakan").style.display = "block"; muatPelacakan(); muatChat(); }

    function kirimPesanan() {
        kodeSaya = "HS-" + Math.floor(Math.random()*90000+10000);
        const data = {
            kode: kodeSaya, nama: document.getElementById("nama").value, wa: document.getElementById("wa").value,
            layanan: document.getElementById("layanan").value, merek: document.getElementById("merek").value,
            kerusakan: document.getElementById("kerusakan").value, status: "baru"
        };
        fetch(`${API_URL}/orders`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(data) })
        .then(() => { localStorage.setItem("kodePelanggan", kodeSaya); location.reload(); });
    }

    function tanyaLacak() {
        const input = prompt("Masukkan Kode Pesanan:");
        if(input) { localStorage.setItem("kodePelanggan", input); location.reload(); }
    }

    function keluarLacak() { localStorage.removeItem("kodePelanggan"); location.reload(); }

    function muatPelacakan() {
        fetch(`${API_URL}/orders/${kodeSaya}`).then(res => res.json()).then(d => {
            document.getElementById("lblKode").textContent = d.kode;
            document.getElementById("lblStatus").textContent = d.status.toUpperCase();
            document.getElementById("lblJasa").textContent = d.biayaJasa.toLocaleString('id-ID');
            document.getElementById("lblSuku").textContent = d.biayaSuku.toLocaleString('id-ID');
            document.getElementById("lblTambahan").textContent = d.biayaSukuTambahan.toLocaleString('id-ID');
            document.getElementById("lblTotal").textContent = (d.biayaJasa + d.biayaSuku + d.biayaSukuTambahan).toLocaleString('id-ID');
        });
    }

    function kirimChat() {
        const teks = document.getElementById("inputChat").value;
        if(!teks) return;
        fetch(`${API_URL}/chats`, {
            method: "POST", headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ kode: kodeSaya, pengirim: 'user', teks, waktu: new Date().toLocaleTimeString('id-ID') })
        }).then(() => { document.getElementById("inputChat").value = ""; });
    }

    function muatChat() {
        fetch(`${API_URL}/chats/${kodeSaya}`).then(res => res.json()).then(chats => {
            const box = document.getElementById("chatBox"); box.innerHTML = "";
            chats.forEach(c => {
                const align = c.pengirim === 'user' ? 'text-align:right; color:#0ea5e9;' : 'text-align:left; color:#10b981;';
                box.innerHTML += `<p style="${align} font-weight:bold; margin-bottom:5px;">${c.teks}</p>`;
            });
            box.scrollTop = box.scrollHeight;
        });
    }
</script>
</body>
</html>
