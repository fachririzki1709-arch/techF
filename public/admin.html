<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Dispatcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif;}
        body {background:#f1f5f9; color:#1e293b; padding:2rem;}
        .card {background:white; padding:2rem; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.05); margin-bottom:1.5rem;}
        table {width:100%; border-collapse:collapse;} th, td {padding:1rem; text-align:left; border-bottom:1px solid #e2e8f0;}
        th {background:#f8fafc;}
        input, select {padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px; width:100%; margin-bottom:10px;}
        .btn {padding:0.6rem 1rem; border:none; border-radius:6px; cursor:pointer; font-weight:bold; background:#10b981; color:white;}
        
        #modalAdmin {display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:100;}
        .modal-content {background:white; width:90%; max-width:600px; margin:2% auto; padding:2rem; border-radius:12px; max-height:90vh; overflow-y:auto;}
        .read-only-box {background:#f1f5f9; border:1px dashed #94a3b8; padding:1rem; border-radius:6px; margin:1rem 0;}
    </style>
</head>
<body>

<div class="card">
    <div style="display:flex; justify-content:space-between;">
        <h2>Pusat Kendali Admin (Dispatcher & Finance)</h2>
        <button class="btn" style="background:#ef4444;" onclick="logout()">Logout</button>
    </div>
    
    <table style="margin-top:2rem;">
        <thead><tr><th>Kode</th><th>Pelanggan</th><th>Perangkat</th><th>Status Real-Time</th><th>Aksi Admin</th></tr></thead>
        <tbody id="tabelData"></tbody>
    </table>
</div>

<!-- Modal Kelola Oleh Admin -->
<div id="modalAdmin">
    <div class="modal-content">
        <h3 style="margin-bottom:1rem; border-bottom:2px solid #e2e8f0; padding-bottom:10px;">Atur Order: <span id="mKode"></span></h3>
        
        <!-- HANYA ADMIN YANG BISA SET JADWAL & TEKNISI -->
        <label>Pilih Teknisi Penanggung Jawab:</label>
        <select id="mTeknisi">
            <option value="">-- Belum Ditentukan --</option>
            <option value="Teknisi Andi">Teknisi Andi</option>
            <option value="Teknisi Budi">Teknisi Budi</option>
        </select>

        <label>Biaya Jasa Admin/Toko (Rp):</label>
        <input type="number" id="mJasa" placeholder="0">

        <!-- ADMIN HANYA BISA MELIHAT LAPORAN TEKNISI, TIDAK BISA MENGINPUT -->
        <div class="read-only-box">
            <h4 style="color:#d97706; margin-bottom:10px;">Laporan Lapangan dari Teknisi (READ ONLY)</h4>
            <p style="font-size:0.9rem;">Status Lapangan: <strong id="mStatusTech">-</strong></p>
            <p style="font-size:0.9rem;">Biaya Part (Awal): Rp <strong id="mPart">-</strong></p>
            <p style="font-size:0.9rem; color:#ef4444;">Part Tambahan: Rp <strong id="mTambahan">-</strong> <br> <small>(Info: <span id="mInfoTambahan"></span>)</small></p>
        </div>

        <button class="btn" style="background:#0ea5e9; width:100%; margin-bottom:10px;" onclick="simpanJadwalAdmin()">1. Simpan & Tugaskan Ke Teknisi</button>
        <button class="btn" style="background:#10b981; width:100%; margin-bottom:10px;" onclick="validasiLunasAdmin()">2. Validasi Pembayaran Lunas (Selesai)</button>
        <button class="btn" style="background:#94a3b8; width:100%;" onclick="tutupModal()">Batal / Tutup</button>
    </div>
</div>

<script>
    const API_URL = window.location.origin + "/api";
    let token = sessionStorage.getItem("adminToken");
    let currentKode = "";
    const socket = io(window.location.origin);

    if(!token) loginAdmin();
    else muatData();

    socket.on("updateSistem", () => { if(token) muatData(); });

    function loginAdmin() {
        const u = prompt("ID Admin:"); const p = prompt("Password Admin:");
        fetch(`${API_URL}/admin/login`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({username:u, password:p}) })
        .then(res=>res.json()).then(d => { if(d.token){ sessionStorage.setItem("adminToken", d.token); location.reload(); } else alert("Salah!"); });
    }
    function logout() { sessionStorage.removeItem("adminToken"); location.reload(); }

    function getAuth() { return { "Authorization": `Bearer ${token}` }; }

    function muatData() {
        fetch(`${API_URL}/orders`, {headers: getAuth()}).then(res=>res.json()).then(data => {
            const tbody = document.getElementById("tabelData"); tbody.innerHTML = "";
            Object.values(data).forEach(d => {
                tbody.innerHTML += `<tr>
                    <td><strong>${d.kode}</strong></td> <td>${d.nama}</td> <td>${d.merek}</td>
                    <td><span style="background:#fef3c7; color:#d97706; padding:4px 8px; border-radius:4px; font-weight:bold; font-size:0.8rem;">${d.status.toUpperCase()}</span></td>
                    <td><button class="btn" onclick="bukaModal('${d.kode}')">Kelola Order</button></td>
                </tr>`;
            });
        });
    }

    function bukaModal(kode) {
        currentKode = kode;
        fetch(`${API_URL}/orders/${kode}`, {headers: getAuth()}).then(res=>res.json()).then(d => {
            document.getElementById("mKode").textContent = kode;
            document.getElementById("mTeknisi").value = d.teknisi || "";
            document.getElementById("mJasa").value = d.biayaJasa || 0;
            
            // Read Only Data dari Teknisi
            document.getElementById("mStatusTech").textContent = d.status.toUpperCase();
            document.getElementById("mPart").textContent = d.biayaSuku.toLocaleString('id-ID');
            document.getElementById("mTambahan").textContent = d.biayaSukuTambahan.toLocaleString('id-ID');
            document.getElementById("mInfoTambahan").textContent = d.infoKerusakanTambahan || "Tidak ada temuan";
            
            document.getElementById("modalAdmin").style.display = "block";
        });
    }
    function tutupModal() { document.getElementById("modalAdmin").style.display = "none"; }

    function simpanJadwalAdmin() {
        const dataAdmin = {
            teknisi: document.getElementById("mTeknisi").value,
            biayaJasa: parseInt(document.getElementById("mJasa").value) || 0,
            status: "dijadwalkan" // Mengirim order ke dashboard teknisi
        };
        fetch(`${API_URL}/orders/${currentKode}`, { method: "PUT", headers: {...getAuth(), "Content-Type":"application/json"}, body: JSON.stringify(dataAdmin) })
        .then(() => { Swal.fire('Disimpan', 'Tugas berhasil dilempar ke teknisi', 'success'); tutupModal(); });
    }

    function validasiLunasAdmin() {
        fetch(`${API_URL}/orders/${currentKode}`, { method: "PUT", headers: {...getAuth(), "Content-Type":"application/json"}, body: JSON.stringify({status: "selesai", pembayaranValid: true}) })
        .then(() => { Swal.fire('Tervalidasi', 'Transaksi Lunas & Selesai', 'success'); tutupModal(); });
    }
</script>
</body>
</html>
