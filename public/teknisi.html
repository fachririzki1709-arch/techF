<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Teknisi - SF Tech</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- TAG STYLE WAJIB DITAMBAHKAN AGAR LAYOUT TIDAK RUSAK -->
    <style>
        
        :root { 
            --bg-utama: #f8fafc; 
            --teks-utama: #0f172a; 
            --bg-kartu: #ffffff; 
            --border-line: #e2e8f0; 
            --primary: #0ea5e9; 
            --primary-hover: #0284c7;
            --success: #10b981;
            --warning: #f59e0b;
        }
        body.dark-mode { 
            --bg-utama: #0f172a; 
            --teks-utama: #f8fafc; 
            --bg-kartu: #1e293b; 
            --border-line: #334155; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-utama); color: var(--teks-utama); padding-bottom: 80px; transition: 0.3s; }

        /* HEADER MODERN GLASMORPHISM */
        header { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px);
            padding: 1.2rem 1.5rem; 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 100; 
            border-bottom: 1px solid var(--border-line); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }
        body.dark-mode header { background: rgba(30, 41, 59, 0.9); }
        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.2rem; color: var(--teks-utama); }
        .logo-area i { color: var(--primary); font-size: 1.5rem; }

        /* TOMBOL STATUS KERJA */
        .status-toggle { 
            display: flex; align-items: center; gap: 8px; 
            background: #f1f5f9; padding: 6px 14px; border-radius: 30px; 
            font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: 0.3s;
            border: 1px solid var(--border-line);
        }
        .status-toggle.aktif { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
        .status-toggle.aktif .dot { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }
        .status-toggle .dot { width: 10px; height: 10px; background: #94a3b8; border-radius: 50%; display: inline-block; transition: 0.3s; }

        .container { padding: 1.5rem; }

        /* KARTU ORDER (GOJEK/GRAB STYLE) */
        .order-card { 
            background: var(--bg-kartu); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.2rem; 
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.04); border: 1px solid var(--border-line); 
            position: relative; overflow: hidden; animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            display: flex; flex-direction: column; gap: 12px;
        }
        @keyframes slideIn { from { transform: translateY(-20px) scale(0.98); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

        .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--border-line); padding-bottom: 12px; }
        .order-header h4 { font-size: 1.1rem; font-weight: 800; color: var(--teks-utama); }
        .badge-layanan { background: #e0f2fe; color: #0284c7; font-size: 0.75rem; font-weight: 800; padding: 5px 12px; border-radius: 20px; }

        .info-row { display: flex; align-items: flex-start; gap: 12px; font-size: 0.9rem; color: #475569; line-height: 1.4; }
        .info-row i { color: var(--primary); font-size: 1.2rem; margin-top: 2px; }
        body.dark-mode .info-row { color: #cbd5e1; }

        .kerusakan-box { background: #fffbeb; border-left: 4px solid #f59e0b; padding: 12px; border-radius: 8px; margin-top: 4px; }
        body.dark-mode .kerusakan-box { background: rgba(245, 158, 11, 0.1); }
        .kerusakan-box-title { font-size: 0.8rem; color: #d97706; font-weight: 800; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .kerusakan-box-text { font-size: 0.9rem; color: #475569; font-weight: 600; }
        body.dark-mode .kerusakan-box-text { color: #f8fafc; }

        /* TOMBOL AKSI UTAMA */
        .btn { padding: 0.9rem; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-take { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; width: 100%; margin-top: 10px; box-shadow: 0 6px 15px rgba(16, 185, 129, 0.25); }
        .btn-take:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35); }
        .btn-take:active { transform: scale(0.98); }
        .btn-secondary { background: var(--bg-utama); color: var(--primary); border: 1px solid var(--border-line); }

        /* BOTTOM NAVIGATION MODERN */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-line); 
            display: flex; justify-content: space-around; 
            padding: 12px 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); 
            box-shadow: 0 -4px 20px rgba(0,0,0,0.03); z-index: 100; 
        }
        body.dark-mode .bottom-nav { background: rgba(30, 41, 59, 0.95); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; font-size: 0.75rem; font-weight: 700; text-decoration: none; gap: 4px; cursor: pointer; transition: 0.3s; }
        .nav-item i { font-size: 1.5rem; transition: 0.3s; }
        .nav-item.aktif { color: var(--primary); }
        .nav-item.aktif i { transform: translateY(-3px); }

        .empty-state { text-align: center; padding: 4rem 1.5rem; color: #94a3b8; }
        .empty-state i { font-size: 4rem; margin-bottom: 15px; display: block; color: #cbd5e1; }
        .empty-state h3 { font-size: 1.2rem; color: var(--teks-utama); margin-bottom: 5px; }

        /* KUSTOMISASI SWEETALERT AGAR MODERN */
        .swal2-popup { border-radius: 20px !important; }
        @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}
    </style>
</head>
<body>
    <div class="login-overlay" id="loginTeknisiOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; display:flex; justify-content:center; align-items:center; z-index:9999;">
        <div class="login-box" style="background:white; padding:3rem; border-radius:16px; width:100%; max-width:420px; box-shadow:0 20px 50px rgba(0,0,0,0.4); text-align:center;">
            <h2><i class="bi bi-tools" style="color:#0ea5e9;"></i> Login Teknisi</h2>
            <p style="color:#64748b; font-size:0.95rem; margin-bottom:2rem;">Masukkan kredensial dari admin</p>
            
            <input type="text" id="teknisiUsername" placeholder="Username teknisi..." style="background:#f8fafc; color:#0f172a; border:2px solid #e2e8f0; width:100%; padding:0.75rem 1rem; margin:0.5rem 0 1.2rem; border-radius:8px;">
            <input type="password" id="teknisiPassword" placeholder="Password..." style="background:#f8fafc; color:#0f172a; border:2px solid #e2e8f0; width:100%; padding:0.75rem 1rem; margin:0.5rem 0 1.2rem; border-radius:8px;">
            
            <button class="btn btn-take" onclick="prosesLoginTeknisi()">Masuk Panel Teknisi</button>

    <header>

        <span class="dot"></span> <span id="lblStatus">On Duty</span>
    </div>

<!-- KONTAINER UTAMA DENGAN SISTEM TAB -->
<div class="container">
    <!-- Tab Navigasi Atas -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button id="tabBtnBaru" class="btn" style="flex:1; background: var(--primary); color:white; font-size:0.9rem;" onclick="gantiTab('baru')">
            <i class="bi bi-broadcast"></i> Order Masuk
        </button>
        <button id="tabBtnAktif" class="btn" style="flex:1; background: var(--bg-utama); color: var(--teks-utama); border: 1px solid var(--border-line); font-size:0.9rem;" onclick="gantiTab('aktif')">
            <i class="bi bi-tools"></i> Tugas Aktif <span id="badgeTugasAktif" style="background:var(--warning); color:white; padding:2px 6px; border-radius:10px; font-size:0.75rem; margin-left:5px;">0</span>
        </button>

    <!-- Konten Tab 1: Order Baru (Radar) -->

</div>

<!-- NAVIGASI BAWAH -->
<nav class="bottom-nav">
    <div class="nav-item aktif" onclick="location.reload()">
        <i class="bi bi-radar"></i> <span>Dashboard</span>
    </div>
    <div class="nav-item" onclick="logoutTeknisi()">

<!-- OVERLAY TAMPILAN SERVICE KERJA -->
<div id="serviceWorkspaceOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-utama); z-index:9999; overflow-y:auto; animation: slideUp 0.3s ease-out;">
    
    <!-- Sticky Header -->

<!-- OVERLAY CHAT TEKNISI -->
<div id="chatTeknisiOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-utama); z-index:10000; flex-direction:column; animation: slideUp 0.3s ease-out;">
    <div style="background:var(--bg-kartu); padding:15px; border-bottom:1px solid var(--border-line); display:flex; align-items:center; gap:10px; position:sticky; top:0;">
        <button onclick="tutupChatTeknisi()" style="background:none; border:none; font-size:1.2rem; color:var(--teks-utama);"><i class="bi bi-arrow-left"></i></button>
        <h3 style="font-size:1.1rem; margin:0;">Ruang Chat: <span id="chatKodeOrderTitle" style="color:var(--primary);"></span></h3>

    <div id="chatBoxTeknisi" style="flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px; background:var(--bg-utama);">
        <!-- Pesan Chat akan Muncul di Sini -->

    <div style="background:var(--bg-kartu); padding:15px; border-top:1px solid var(--border-line); display:flex; gap:10px; position:sticky; bottom:0;">
        <input type="text" id="inputChatTeknisi" placeholder="Ketik pesan untuk pelanggan..." style="flex:1; padding:12px; border-radius:12px; border:1px solid var(--border-line); outline:none;" onkeypress="if(event.key === 'Enter') kirimChatTeknisi()">
        <button class="btn btn-take" style="margin:0; width:auto; padding:0 20px; border-radius:12px;" onclick="kirimChatTeknisi()"><i class="bi bi-send-fill"></i></button>

    <!-- Sticky Bottom Actions -->
    <div style="position:fixed; bottom:0; left:0; width:100%; background:var(--bg-kartu); padding:15px; border-top:1px solid var(--border-line); display:flex; gap:10px;">
        <button class="btn" style="flex:1; background:var(--bg-utama); color:var(--primary); border:1px solid var(--border-line);" id="btnWsChat">
            <i class="bi bi-chat-dots-fill"></i> Chat
        </button>
        <button class="btn btn-take" style="flex:2; margin:0;" id="btnWsSelesai">
            <i class="bi bi-check-circle-fill"></i> Selesaikan Servis

</div>

<style>
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .qc-box { background: var(--bg-kartu); border: 1px solid var(--border-line); border-radius: 12px; padding: 15px; margin-top: 15px; }
    .qc-box label { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border-line); font-size: 0.9rem;}
</style>
    <script>
        const socket = io(window.location.origin);
        let profilTeknisi = { nama: "", keahlian: [] };
        let isAktif = true;

        // Helper Header Authorization untuk endpoint khusus Teknisi
        function getAuthHeaderTeknisi() {
            const token = sessionStorage.getItem("teknisiToken");
            return token ? { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" } : { "Content-Type": "application/json" };
        }

        document.addEventListener("DOMContentLoaded", () => {
            const token = sessionStorage.getItem("teknisiToken");
            if(token) {
                document.getElementById("loginTeknisiOverlay").style.display = "none";
                profilTeknisi.nama = sessionStorage.getItem("teknisiNama") || "Teknisi";
                document.getElementById("namaHeader").textContent = profilTeknisi.nama;
                muatOrderTersedia(); 
            }
        });
        

        function prosesLoginTeknisi() {
            const username = document.getElementById("teknisiUsername").value.trim();
            const password = document.getElementById("teknisiPassword").value;
            if(!username || !password) return Swal.fire('Peringatan', 'Username dan Password wajib diisi', 'warning');

            const btn = document.querySelector('.login-box .btn-take');
            btn.innerHTML = '<i class="bi bi-hourglass"></i> Memproses...';
            btn.disabled = true;

            fetch(`${window.location.origin}/api/teknisi/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(async res => {
                const data = await res.json();
                if(!res.ok) throw new Error(data.message || "Login gagal");
                return data;
            })
            .then(data => {
                sessionStorage.setItem("teknisiToken", data.token);
                sessionStorage.setItem("teknisiNama", data.nama);
                profilTeknisi.nama = data.nama;
                document.getElementById("namaHeader").textContent = data.nama;
                
                document.getElementById("loginTeknisiOverlay").style.display = "none";
                Swal.fire({ icon: 'success', title: data.message, timer: 1500, showConfirmButton: false });
                
                muatOrderTersedia(); 
            })
            .catch((err) => {
                Swal.fire('Gagal', err.message, 'error');
            })
            .finally(() => {
                btn.innerHTML = 'Masuk Panel Teknisi';
                btn.disabled = false;
            });
        }

        function logoutTeknisi() {
            sessionStorage.removeItem("teknisiToken");
            sessionStorage.removeItem("teknisiNama");
            location.reload();
        }
        let daftarTugasAktif = []; // Menyimpan state tugas yang sedang dipegang

// 1. Sistem Navigasi Tab (Order Baru vs Tugas Aktif)
function gantiTab(target) {
    const secBaru = document.getElementById('sectionOrderBaru');
    const secAktif = document.getElementById('sectionTugasAktif');
    const btnBaru = document.getElementById('tabBtnBaru');
    const btnAktif = document.getElementById('tabBtnAktif');

    if(target === 'baru') {
        secBaru.style.display = 'block';
        secAktif.style.display = 'none';
        btnBaru.style.background = 'var(--primary)';
        btnBaru.style.color = 'white';
        btnAktif.style.background = 'var(--bg-utama)';
        btnAktif.style.color = 'var(--teks-utama)';
    } else {
        secBaru.style.display = 'none';
        secAktif.style.display = 'block';
        btnAktif.style.background = 'var(--primary)';
        btnAktif.style.color = 'white';
        btnBaru.style.background = 'var(--bg-utama)';
        btnBaru.style.color = 'var(--teks-utama)';
    }
}

// 2. Implementasi Skeleton Loading saat memuat data awal
function tampilkanSkeletonLoading() {
    const list = document.getElementById('listOrderBaru');
    list.innerHTML = `
        <div style="background: var(--bg-kartu); padding: 1.5rem; border-radius: 16px; margin-bottom: 1rem; animation: pulse 1.5s infinite;">
            <div style="height: 20px; background: #e2e8f0; border-radius: 4px; width: 40%; margin-bottom: 10px;"></div>
            <div style="height: 15px; background: #e2e8f0; border-radius: 4px; width: 70%; margin-bottom: 8px;"></div>
            <div style="height: 40px; background: #e2e8f0; border-radius: 8px; margin-top: 15px;"></div>
        </div>
    `;
}

        function toggleStatus() {
            isAktif = !isAktif;
            const btn = document.getElementById('btnStatusKerja');
            const lbl = document.getElementById('lblStatus');
            const statusBaru = isAktif ? "luang" : "offline";
            
            if(isAktif) {
                btn.classList.add('aktif');
                lbl.innerText = "On Duty";
            } else {
                btn.classList.remove('aktif');
                lbl.innerText = "Offline";
            }

            fetch(`${window.location.origin}/api/teknisi/status`, {
                method: 'PUT',
                headers: getAuthHeaderTeknisi(),
                body: JSON.stringify({ statusKerja: statusBaru })
            }).catch(err => console.error("Gagal sinkron status:", err));
        }

// Modifikasi fungsi muatOrderTersedia dengan Skeleton
function muatOrderTersedia() {
    tampilkanSkeletonLoading();
    fetch(`${window.location.origin}/api/teknisi/orders/available`, { headers: getAuthHeaderTeknisi() })
    .then(res => res.json())
    .then(data => {
        document.getElementById('listOrderBaru').innerHTML = "";
        if(data && data.length > 0) {
            data.forEach(order => tampilkanKartuOrder(order));
        }
        cekEmptyState();
    }).catch(err => console.error("Gagal memuat order: ", err));
}

        socket.on('orderSudahDiambil', (data) => {
    const kartuTarget = document.getElementById(`order-${data.kodeOrder}`);
    if (kartuTarget) {
        // PERBAIKAN: Hanya hapus kartu dari layar JIKA yang mengambil BUKAN teknisi ini
        if (data.oleh !== profilTeknisi.nama) {
            kartuTarget.remove();
            cekEmptyState();
            
            Swal.fire({
                title: 'Terlewat!',
                text: `Order ${data.kodeOrder} baru saja diambil oleh ${data.oleh}`,
                icon: 'info',
                timer: 2000,
                showConfirmButton: false,
                toast: true,
                position: 'top-end'
            });
        }
    }
});

        function tampilkanKartuOrder(order) {
            if (document.getElementById(`order-${order.kode}`)) return; 

            document.getElementById('radarKosong').style.display = 'none';

            const div = document.createElement('div');
            div.className = 'order-card';
            div.id = `order-${order.kode}`;
            
            let ikonUnit = order.layanan && order.layanan.toLowerCase().includes("laptop") ? "bi-laptop" : "bi-phone";
            
            let linkMaps = "";
            if(order.lat && order.lng) {
                linkMaps = `<a href="https://www.google.com/maps?q=${order.lat},${order.lng}" target="_blank" class="btn btn-secondary" style="width: 100%; font-size:0.9rem; margin-top:5px;">
                                <i class="bi bi-compass-fill"></i> Navigasi Rute Maps
                            </a>`;
            }

            div.innerHTML = `
                <div class="order-header">
                    <h4>${order.kode}</h4>
                    <span class="badge-layanan">
                        ${order.lokasiServis === 'home_service' ? '<i class="bi bi-house-door-fill"></i> On-Site' : '<i class="bi bi-geo-alt-fill"></i> COD'}
                    </span>
                </div>
                
                <div class="info-row">
                    <i class="bi bi-person-bounding-box"></i>
                    <div>
                        <strong style="color: var(--teks-utama); font-size: 1rem;">${order.nama}</strong>
                        <div style="font-size: 0.8rem; margin-top: 2px;">${order.wa}</div>
                    </div>
                </div>

                <div class="info-row">
                    <i class="bi ${ikonUnit}"></i>
                    <div>
                        <strong style="color: var(--teks-utama); font-size: 0.95rem;">${order.merek} ${order.tipe}</strong>
                    </div>
                </div>
                
                <div class="kerusakan-box">
                    <div class="kerusakan-box-title"><i class="bi bi-exclamation-triangle-fill"></i> Detail Kerusakan:</div>
                    <div class="kerusakan-box-text">${order.kerusakan || "Tidak ada detail keluhan."}</div>
                </div>

                <div id="map-${order.kode}" style="height: 140px; width: 100%; border-radius: 12px; margin-top: 5px; z-index: 1; border: 1px solid var(--border-line); display: ${order.lat ? 'block' : 'none'};"></div>
                
                ${linkMaps}

                <button class="btn btn-take" onclick="tarikOrder('${order.kode}')">
                    Ambil Pekerjaan <i class="bi bi-arrow-right-circle-fill"></i>
                </button>
            `;
            
            document.getElementById('listOrderBaru').prepend(div);
            
            if(order.lat && order.lng) {
                setTimeout(() => {
                    const mapCenter = [parseFloat(order.lat), parseFloat(order.lng)];
                    const mapMini = L.map(`map-${order.kode}`, {
                        zoomControl: false, dragging: false, scrollWheelZoom: false
                    }).setView(mapCenter, 15);
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapMini);
                    L.marker(mapCenter).addTo(mapMini);
                }, 300);
            }
            
            if(window.navigator.vibrate) window.navigator.vibrate([200, 100, 200]); 
        }

                </button>

        }
        
        // PERBAIKAN: Cukup gunakan prepend. Metode append/prepend otomatis memindahkan elemen di DOM tanpa perlu removeChild()
        document.getElementById('listTugasAktif').prepend(kartu);

let aktifChatKode = "";

// 1. FUNGSI WORKSPACE MENGGUNAKAN DATA ASLI DARI SERVER
function bukaWorkspace(kodeOrder) {
    // Ambil data detail terbaru dari server
    fetch(`${window.location.origin}/api/orders/${kodeOrder}`, { headers: getAuthHeaderTeknisi() })
    .then(res => res.json())
    .then(order => {
        document.getElementById('serviceWorkspaceOverlay').style.display = 'block';
        document.getElementById('wsKodeOrder').innerText = kodeOrder;
        
        document.getElementById('wsKonten').innerHTML = `
            <div style="background:var(--bg-kartu); padding:15px; border-radius:12px; margin-top:15px; border:1px solid var(--border-line);">
                <h4 style="margin-bottom:10px; font-size:1rem; color:var(--primary);"><i class="bi bi-person-lines-fill"></i> Detail Pelanggan</h4>
                <p style="margin:0; font-size:0.9rem;"><strong>Nama:</strong> ${order.nama}</p>
                <p style="margin:5px 0 0 0; font-size:0.9rem;"><strong>Unit:</strong> ${order.merek} ${order.tipe}</p>
                <p style="margin:5px 0 0 0; font-size:0.9rem; color:var(--warning);"><strong>Kendala:</strong> ${order.kerusakan}</p>
            </div>

            <div class="qc-box">
                <h4 style="margin-bottom:10px; font-size:1rem; color:var(--primary);"><i class="bi bi-ui-checks"></i> QC Checklist (Akhir)</h4>
                <label><input type="checkbox" id="qc_layar" style="width:18px; height:18px;"> Layar & Sentuhan</label>
                <label><input type="checkbox" id="qc_baterai" style="width:18px; height:18px;"> Baterai & Charging</label>
                <label style="border:none;"><input type="checkbox" id="qc_kamera" style="width:18px; height:18px;"> Kamera / Sinyal / Lainnya</label>
            </div>

            <div style="background:var(--bg-kartu); padding:15px; border-radius:12px; margin-top:15px; border:1px solid var(--border-line);">
                <h4 style="margin-bottom:10px; font-size:1rem; color:var(--primary);"><i class="bi bi-receipt"></i> Logistik & Tagihan</h4>
                <label style="font-size:0.85rem; font-weight:bold;">Biaya Sparepart / Jasa (Rp):</label>
                <input type="number" id="biayaPart-${kodeOrder}" value="${order.biayaSuku || 0}" placeholder="0" style="width:100%; padding:10px; margin-top:5px; border-radius:8px; border:1px solid var(--border-line);">
                
                <label style="font-size:0.85rem; font-weight:bold; display:block; margin-top:15px;">Upload Bukti / Foto Komponen (Opsional):</label>
                <input type="file" id="fotoBukti-${kodeOrder}" accept="image/*" style="width:100%; padding:10px; margin-top:5px; background:var(--bg-utama); border-radius:8px;">
            </div>
        `;

        document.getElementById('btnWsChat').onclick = () => bukaChatTeknisi(kodeOrder);
        document.getElementById('btnWsSelesai').onclick = () => selesaikanTugas(kodeOrder);
    });
}

// 2. FUNGSI SELESAIKAN TUGAS (MENGGUNAKAN ENDPOINT YANG BENAR)
function selesaikanTugas(kodeOrder) {
    const biayaPart = document.getElementById(`biayaPart-${kodeOrder}`).value || 0;
    const fileInput = document.getElementById(`fotoBukti-${kodeOrder}`);
    
    Swal.fire({
        title: 'Selesaikan Pekerjaan?',
        text: `Tandai selesai dengan biaya Rp ${biayaPart}?`,
        icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, Selesai'
    }).then((result) => {
        if (result.isConfirmed) {
            const formData = new FormData();
            formData.append('status', 'selesai_servis');
            formData.append('biayaSuku', biayaPart);
            
            // Simpan data QC
            formData.append('qcChecklist[layar]', document.getElementById('qc_layar').checked);
            formData.append('qcChecklist[baterai]', document.getElementById('qc_baterai').checked);
            formData.append('qcChecklist[kamera]', document.getElementById('qc_kamera').checked);

            if (fileInput.files.length > 0) formData.append('fotoPart', fileInput.files[0]);

            // Endpoint yang benar adalah PUT /api/orders/:kode
            fetch(`${window.location.origin}/api/orders/${kodeOrder}`, {
                method: "PUT",
                headers: { "Authorization": `Bearer ${sessionStorage.getItem("teknisiToken")}` },
                body: formData
            }).then(res => {
                if(res.ok) {
                    Swal.fire('Sukses', 'Servis selesai dilaporkan!', 'success');
                    document.getElementById(`order-${kodeOrder}`).remove();
                    daftarTugasAktif = daftarTugasAktif.filter(item => item !== kodeOrder);
                    document.getElementById('badgeTugasAktif').innerText = daftarTugasAktif.length;
                    if(daftarTugasAktif.length === 0) document.getElementById('aktifKosong').style.display = 'block';
                    tutupWorkspace();
                }
            });
        }
    });
}

// 3. LOGIKA SISTEM CHAT TEKNISI
function bukaChatTeknisi(kodeOrder) {
    aktifChatKode = kodeOrder;
    document.getElementById('chatTeknisiOverlay').style.display = 'flex';
    document.getElementById('chatKodeOrderTitle').innerText = kodeOrder;
    muatPesanTeknisi();
}

function tutupChatTeknisi() {
    document.getElementById('chatTeknisiOverlay').style.display = 'none';
    aktifChatKode = "";
}

function muatPesanTeknisi() {
    if(!aktifChatKode) return;
    const box = document.getElementById("chatBoxTeknisi");
    fetch(`${window.location.origin}/api/chats/${aktifChatKode}`, { headers: getAuthHeaderTeknisi() })
    .then(res => res.json())
    .then(data => {
        let html = "";
        data.forEach(msg => {
            let isSelf = (msg.pengirim === 'teknisi' || msg.pengirim === 'admin');
            let align = isSelf ? 'align-self: flex-end; background:var(--primary); color:white;' : 'align-self: flex-start; background:white; color:black; border:1px solid var(--border-line);';
            let label = msg.pengirim === 'user' ? '📱 Pelanggan' : (msg.pengirim === 'teknisi' ? `👨‍🔧 Saya (${msg.namaTeknisi || 'Teknisi'})` : '👨‍💻 Admin');
            
            html += `<div style="max-width:80%; padding:10px 14px; border-radius:12px; font-size:0.9rem; ${align}">
                <strong style="font-size:0.8rem; opacity:0.9;">${label}:</strong><br>${msg.teks}
                <span style="font-size:0.65rem; display:block; text-align:right; margin-top:5px; opacity:0.8;">${msg.waktu}</span>
            </div>`;
        });
        box.innerHTML = html || `<div style="text-align:center; color:gray; margin-top:20px;">Mulai percakapan dengan pelanggan...</div>`;
        box.scrollTop = box.scrollHeight;
    });
}

function kirimChatTeknisi() {
    const input = document.getElementById("inputChatTeknisi");
    const teks = input.value.trim();
    if(!teks || !aktifChatKode) return;

    fetch(`${window.location.origin}/api/chats`, {
        method: "POST", headers: getAuthHeaderTeknisi(),
        body: JSON.stringify({ 
            kode: aktifChatKode, 
            pengirim: 'teknisi', 
            namaTeknisi: profilTeknisi.nama,
            teks: teks, 
            waktu: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) 
        })
    }).then(() => {
        input.value = "";
        muatPesanTeknisi();
    });
}
