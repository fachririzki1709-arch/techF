name: Auto PR with Gemini
on:
  issues:
    types: [labeled]
jobs:
  gemini_edit:
    if: github.event.label.name == 'gemini-task'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install SDK
        run: npm install @google/generative-ai
      - name: Jalankan Script Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTRUCTION: ${{ github.event.issue.body }}
        run: node .github/scripts/gemini_coder.js
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Update by Gemini: #${{ github.event.issue.number }}"
          branch: "gemini-update-${{ github.event.issue.number }}"
